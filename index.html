<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
    const display = document.querySelector('.display');
    let currentInput = '';
    let resultDisplayed = false;
    const buttons = document.querySelectorAll('.button');
    buttons.forEach(button => {
        button.addEventListener('click', (e) => {
            const buttonText = e.target.textContent;
            if (buttonText === 'C') {
                currentInput = '';
                display.textContent = '0';
                resultDisplayed = false;
            }
            else if (buttonText === '+ / -') {
                if (currentInput && !resultDisplayed) {
                    currentInput = String(-parseFloat(currentInput));
                    display.textContent = currentInput;
                }
            }
            else if (buttonText === '%') {
                if (currentInput && !resultDisplayed) {
                    currentInput = String(parseFloat(currentInput) / 100);
                    display.textContent = currentInput;
                }
            }
            else if (buttonText === 'backsp') {
                currentInput = currentInput.slice(0, -1);
                display.textContent = currentInput || '0';
            }
            else if (buttonText === '=') {
                try {
                    currentInput = eval(currentInput) || '0';
                    display.textContent = currentInput;
                    resultDisplayed = true;
                } catch (error) {
                    display.textContent = 'Error';
                    currentInput = '';
                }
            }
            else if (buttonText === '✕')
            {
                try{
                    currentInput += '*';
                    display.textContent = currentInput;
                } catch (error) {
                    display.textContent = 'Error';
                    currentInput = '';
                }
            }
            else {
                if (resultDisplayed) {
                    currentInput = buttonText === '.' ? '0.' : buttonText;
                    resultDisplayed = false;
                } else {
                    currentInput += buttonText;
                }
                display.textContent = currentInput;
            }
        });
    });
});

    </script>
</head>
<body>
    <div class="wrapper">
        <div class="display">143</div>
        <div class="buttonsArea">
            <div class="button cButton">C</div>
            <div class="button">+ / -</div>
            <div class="button">%</div>
            <div class="button">/</div>
            <div class="button">7</div>
            <div class="button">8</div>
            <div class="button">9</div>
            <div class="button">✕</div>
            <div class="button">4</div>
            <div class="button">5</div>
            <div class="button">6</div>
            <div class="button">-</div>
            <div class="button">1</div>
            <div class="button">2</div>
            <div class="button">3</div>
            <div class="button">+</div>
            <div class="button">0</div>
            <div class="button">.</div>
            <div class="button">backsp</div>
            <div class="button">=</div>
        </div>
    </div>
</body>
</html>
